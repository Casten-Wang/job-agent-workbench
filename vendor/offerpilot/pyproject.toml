[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offerpilot"
version = "2.4.0"
description = "OfferPilot 内嵌岗位自动化运行时"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "patchright>=1.58.2",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "markdown2>=2.4",
    "bottle>=0.13",
    "fonttools[woff]>=4.28",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
pdf = [
    "xhtml2pdf>=0.2.11",
]

[project.scripts]
offerpilot = "offerpilot.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/offerpilot"]
artifacts = [
    "src/offerpilot/browser/runtime/*.mjs",
    "src/offerpilot/browser/runtime/site-patterns/*.md",
    "src/offerpilot/data/*.json",
]

# The upstream web frontend is not vendored; the workbench serves web/static/.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
